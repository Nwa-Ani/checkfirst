<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CheckFirst</title>
</head>
<body class="mode-message">
  <div class="atmosphere" aria-hidden="true"></div>
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 64 64" width="24" height="24" aria-hidden="true">
        <path d="M32 6l22 8v18c0 14.5-9.2 26.5-22 30.5C19.2 58.5 10 46.5 10 32V14l22-8z" fill="#F2C14E"/>
        <path d="M22 32.5l7 7 14-14" fill="none" stroke="#080A0F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      CheckFirst
    </div>
    <div id="engine" class="pill off">Ready</div>
  </header>
  <div class="mode-switch" role="tablist" aria-label="What to check">
    <button type="button" role="tab" id="modeMessage" aria-selected="true">Message</button>
    <button type="button" role="tab" id="modeSite" aria-selected="false">Website</button>
  </div>
  <textarea id="input" placeholder="Paste a link, message or invoice text"></textarea>
  <input id="siteInput" class="site-input" type="text" inputmode="url" autocomplete="url" placeholder="Paste a website address, like google.com" />
  <div class="sample-row" id="sampleRow"></div>
  <div class="row">
    <button type="button" class="primary" id="go">Check it</button>
  </div>
  <div id="out"></div>
  <script type="module" src="./result.js"></script>
</body>
</html>
