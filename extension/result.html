<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>CheckFirst</title>
<style>
  body { font: 14px/1.45 system-ui, sans-serif; margin: 0; padding: 16px; width: 380px; color: #1b1f24; background: #fff; }
  h1 { font-size: 16px; margin: 0 0 10px; }
  textarea { width: 100%; box-sizing: border-box; min-height: 80px; border: 1px solid #ccd; border-radius: 8px; padding: 8px; font: inherit; }
  button { margin-top: 8px; border: 0; border-radius: 8px; padding: 8px 14px; background: #1a73e8; color: #fff; font-weight: 600; cursor: pointer; }
  .verdict { margin: 14px 0 6px; padding: 12px; border-radius: 10px; font-weight: 700; font-size: 15px; }
  .scam { background: #fde7e9; color: #b3261e; } .suspicious { background: #fff4d6; color: #8a5a00; } .likely_safe { background: #e6f4ea; color: #137333; }
  ul { padding-left: 18px; margin: 6px 0; } .meta { color: #5f6368; font-size: 12px; } .ai { margin-top: 10px; padding: 10px; border-radius: 8px; background: #f1f3f4; }
</style>
</head>
<body>
  <h1>CheckFirst</h1>
  <textarea id="input" placeholder="Paste a link, message or invoice text"></textarea>
  <button id="go">Check it</button>
  <div id="out"></div>
  <script type="module" src="result.js"></script>
</body>
</html>
